in-height:130px}.monthText{padding:17px 14px}.monthText h2{font-size:34px}.dayCard{padding:16px 14px}.dayTop{grid-template-columns:72px 1fr;column-gap:12px}.dayNo{width:48px;height:48px;font-size:21px}.mediaRow{gap:8px;min-height:98px}.saintMedia{width:78px}.saintImg,.saintPlaceholder{width:78px;height:94px}.dayTitle{margin-top:7px}.dayTitle h3{font-size:19px}.acc{margin-left:84px}.acc button{font-size:15px;padding:12px 14px}}</style></head><body><header class="hero"><div><small>CATHOLIC · 2026</small><h1>가톨릭 365일 성인 축일 달력</h1><div>성인 · 성화 · 생애 · 스페셜리티 · 전구 · 호칭기도</div></div></header><main class="wrap"><button class="era" onclick="location.href='era-prayers.html'">☦ 시대별 · 세기별 성인 호칭기도　⌄</button><div class="months" id="months"></div><input id="search" class="search" placeholder="성인·축일 검색" oninput="render(currentMonth)"><div class="toolbar"><button onclick="showToday()">오늘</button><button onclick="showMonthlyPrayer()">☦ 월별 통합 호칭기도</button></div><section id="list"></section></main><script>window.CATHOLIC_2026=window.CATHOLIC_2026||{};</script><script src="data/january-2026.js"></script><script src="data/february-2026.js"></script><script src="data/march-2026.js"></script><script src="data/april-2026.js"></script><script src="data/may-2026.js"></script><script src="data/june-2026.js"></script><script src="data/july-2026.js"></script><script src="data/august-2026.js"></script><script src="data/september-2026.js"></script><script src="data/october-2026.js"></script><script src="data/november-2026.js"></script><script src="data/december-2026.js"></script><script>const mn=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];let currentMonth=1;const e=s=>(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function monthButtons(){months.innerHTML=mn.map((x,i)=>`<button class="${currentMonth===i+1?'active':''}" onclick="render(${i+1})">${x}</button>`).join('')}function acc(label,body,cls=''){return `<div class="acc ${cls}"><button onclick="this.parentElement.classList.toggle('open')"><span>${label}</span><span>⌄</span></button><div class="accBody">${body}</div></div>`}function invocationsFor(x){if(Array.isArray(x.litanyNames)&&x.litanyNames.length)return x.litanyNames.map(n=>`${e(n)}이여, 저희를 위하여 빌어 주소서.`).join('<br>');if(x.litany)return e(x.litany);const t=x.title||x.n||'';if(/주님|예수|성명|공현|세례/.test(t))return `주 예수 그리스도님, 저희에게 자비를 베푸소서.`;if(/성모 마리아/.test(t))return `천주의 성모 마리아님, 저희를 위하여 빌어 주소서.`;return `${e(t)}이여, 저희를 위하여 빌어 주소서.`}function oneMedia(src,caption,title){if(!src)return `<div class="saintMedia"><div class="saintPlaceholder">정확한 성화<br>준비 중</div><div class="imgCaption">${e(caption||title)}</div></div>`;return `<div class="saintMedia"><img class="saintImg" src="${e(src)}" alt="${e(caption||title)}" onerror="this.outerHTML='<div class=&quot;saintPlaceholder&quot;>정확한 성화<br>준비 중</div>'"><div class="imgCaption">${e(caption||title)}</div></div>`}function media(x,title){if(Array.isArray(x.images)&&x.images.length)return `<div class="mediaRow">${x.images.map((im,i)=>oneMedia(typeof im==='string'?im:im.src,typeof im==='string'?title:(im.caption||title),title)).join('')}</div>`;return `<div class="mediaRow">${oneMedia(x.image||x.img,x.imageCaption||title,title)}</div>`}function dayCard(m,d,x){const title=e(x.title||x.n||'가톨릭 전례일'),detail=e(x.detail||'이 성인과 축일의 생애·역사·영성 자료를 계속 보강하고 있습니다.'),specialty=e(x.specialty||x.i||'신앙의 성장과 성덕, 필요한 은총을 위한 전구'),prayer=e(x.prayer||x.p||'이 날의 성인과 함께 그리스도를 충실히 따르도록 기도합니다.');return `<article class="dayCard"><div class="dayTop"><div class="dayNo">${d}</div>${media(x,title)}<div class="dayTitle"><div class="who">${m}월 ${d}일 축일</div><h3>${title}</h3><div class="meta"><span class="pill">${e(x.rank||'전례일')}</span><span class="pill gold">전례색 ${e(x.color||'—')}</span></div></div></div>${acc('상세보기',`<b>생애 · 역사 · 주요 일화 · 영성</b><br>${detail}<br><br><b>스페셜리티 · 전구 분야</b><br>${specialty}`)}${acc('☦ 호칭기도',prayer,'prayerBody')}${acc(`☦ ${m}월 통합 호칭기도`,monthlyLitany(m),'prayerBody')}</article>`}function monthlyLitany(m){const data=CATHOLIC_2026[m]||{};return Object.keys(data).sort((a,b)=>+a-+b).map(d=>{const x=data[d];return `<div class="litanyLine"><b>${m}월 ${d}일</b><br>${invocationsFor(x)}</div>`}).join('')}function render(m){currentMonth=m;monthButtons();const data=CATHOLIC_2026[m]||{},q=(search.value||'').trim().toLowerCase();let rows=Object.keys(data).sort((a,b)=>+a-+b).map(d=>[d,data[d]]);if(q)rows=rows.filter(([d,x])=>JSON.stringify(x).toLowerCase().includes(q)||`${m}월 ${d}일`.includes(q));list.innerHTML=`<div class="monthHero"><div class="monthPhoto">✠</div><div class="monthText"><small>MONTH ${String(m).padStart(2,'0')}</small><h2>${m}월</h2><p>가톨릭 성인과 축일의 기록</p></div></div><div class="hint">이 달의 성인·축일 성화를 함께 볼 수 있습니다. 각 날짜에는 그날에 해당하는 정확한 성화만 연결합니다.</div>`+(rows.length?rows.map(([d,x])=>dayCard(m,d,x)).join(''):'<article class="dayCard">이 달의 데이터를 보강하고 있습니다.</article>')}function showToday(){const n=new Date();search.value='';render(n.getMonth()+1)}function showMonthlyPrayer(){list.innerHTML=`<div class="monthHero"><div class="monthPhoto">✠</div><div class="monthText"><small>MONTH ${String(currentMonth).padStart(2,'0')}</small><h2>${currentMonth}월</h2><p>모든 성인의 통합 호칭기도</p></div></div><article class="dayCard"><button onclick="render(currentMonth)" style="border:0;background:none;color:#702033;font-weight:900">← 달력으로</button><div style="line-height:1.85;margin-top:12px">${monthlyLitany(currentMonth)}</div></article>`}monthButtons();render(1);if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></body></html>
