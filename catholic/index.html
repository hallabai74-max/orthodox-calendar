<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6f1d2c"><link rel="apple-touch-icon" href="padre-pio-icon.png"><link rel="manifest" href="manifest.webmanifest"><title>가톨릭 365 성인 달력</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:#f7f1e6;color:#2d211b}.hero{min-height:44vh;background:linear-gradient(0deg,rgba(40,15,18,.72),rgba(40,15,18,.12)),url('padre-pio-hero.jpg') center 28%/cover;display:flex;align-items:flex-end;padding:28px 20px;color:white}.hero h1{margin:0;font-size:32px}.hero p{margin:8px 0 0}.wrap{max-width:900px;margin:auto;padding:18px}.months{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.months button,.toolbar button{border:1px solid #c7a45c;background:#fffaf0;border-radius:12px;padding:12px 6px;font-weight:800;color:#6f1d2c}.toolbar{display:flex;gap:8px;overflow:auto;margin:16px 0}.card{background:#fff;border:1px solid #ead8b1;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 8px 24px #5c30121a}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#6f1d2c;color:#fff;font-size:12px;font-weight:800}.date{font-size:13px;color:#8a6b56}.card h2{margin:8px 0;color:#6f1d2c}.detail{border-top:1px solid #eee0c4;margin-top:14px;padding-top:14px;line-height:1.75}.prayer{background:#fff7e6;border-left:4px solid #c49a45;padding:14px;border-radius:10px}.notice{font-size:13px;color:#6f6258;line-height:1.6}@media(max-width:520px){.months{grid-template-columns:repeat(4,1fr)}.hero{min-height:38vh}.hero h1{font-size:27px}}</style></head><body><header class="hero"><div><span class="badge">CATHOLIC · 2026</span><h1>가톨릭 365일 성인 달력</h1><p>성인 · 축일 · 전례색 · 전구 · 호칭기도</p></div></header><main class="wrap"><div class="months" id="months"></div><div class="toolbar"><button onclick="showToday()">오늘</button><button onclick="alert('월별 통합 호칭기도를 구축 중입니다.')">월별 통합 호칭기도</button><button onclick="alert('시대별 통합 호칭기도를 구축 중입니다.')">시대별 호칭기도</button></div><p class="notice">2026년 일반 로마 전례력과 공식 전례 자료를 기준으로 날짜별 데이터를 검수하여 확장하고 있습니다.</p><section id="list"></section></main><script>const special={"01-01":{n:"천주의 성모 마리아 대축일",r:"대축일",c:"백색"},"01-02":{n:"성 대 바실리오와 나지안조의 성 그레고리오 주교 학자",r:"기념일",c:"백색",i:"정통 신앙, 신학 연구, 성직자와 교사, 교회의 일치",p:"성 바실리오와 성 그레고리오여, 저희가 진리를 사랑하고 겸손히 교회를 섬기도록 전구해 주소서. 아멘."},"01-03":{n:"지극히 거룩하신 예수 성명",r:"선택 기념일",c:"백색"},"01-05":{n:"성 요한 노이만 주교",r:"기념일",c:"백색"},"01-06":{n:"성 안드레 베세트 수도자",r:"선택 기념일",c:"백색"},"01-07":{n:"페냐포르트의 성 라이문도 사제",r:"선택 기념일",c:"백색"},"01-13":{n:"성 힐라리오 주교 학자",r:"선택 기념일",c:"백색"},"01-17":{n:"성 안토니오 아빠스",r:"기념일",c:"백색",i:"수도생활, 유혹과 영적 싸움, 금욕, 기도와 분별",p:"성 안토니오 아빠스여, 저희가 유혹 속에서도 그리스도께 충실하고 기도와 절제로 마음을 지키도록 전구해 주소서. 아멘."},"01-20":{n:"성 파비아노 교황 순교자 · 성 세바스티아노 순교자",r:"선택 기념일",c:"홍색"},"01-21":{n:"성녀 아녜스 동정 순교자",r:"기념일",c:"홍색",i:"순결, 젊은이, 신앙의 용기, 박해받는 그리스도인",p:"성녀 아녜스여, 저희가 어떤 시련에서도 그리스도께 충실하도록 전구해 주소서. 아멘."},"01-23":{n:"성녀 마리안 코프 동정",r:"선택 기념일",c:"백색",i:"병자, 소외된 이들, 돌봄과 자비, 의료 봉사",p:"성녀 마리안 코프여, 고통받고 소외된 이들에게 자비로 다가갈 수 있도록 저희를 위하여 전구해 주소서. 아멘."},"01-24":{n:"성 프란치스코 살레시오 주교 학자",r:"기념일",c:"백색"},"01-25":{n:"성 바오로 사도의 회심 축일",r:"축일",c:"백색",i:"회심, 선교, 복음 전파, 삶의 방향을 찾는 이들",p:"성 바오로 사도여, 저희가 주님의 부르심을 알아듣고 복음을 담대히 살아가도록 전구해 주소서. 아멘."},"01-26":{n:"성 티모테오와 성 티토 주교",r:"기념일",c:"백색"},"01-27":{n:"성녀 안젤라 메리치 동정",r:"선택 기념일",c:"백색"},"01-28":{n:"성 토마스 아퀴나스 사제 학자",r:"기념일",c:"백색",i:"공부, 신학, 철학, 학생과 교사, 지혜와 이해",p:"성 토마스 아퀴나스여, 저희 지성을 밝혀 주시어 진리를 사랑하고 배운 것을 하느님의 영광을 위해 사용하도록 전구해 주소서. 아멘."},"01-31":{n:"성 요한 보스코 사제",r:"기념일",c:"백색",i:"청소년, 교육자, 학교, 직업 교육, 젊은이의 신앙",p:"성 요한 보스코여, 모든 젊은이가 사랑 안에서 성장하고 좋은 스승을 만나도록 전구해 주소서. 아멘."},"02-02":{n:"주님 봉헌 축일",r:"축일",c:"백색",i:"봉헌 생활, 가정의 신앙, 하느님께 자신을 맡김",p:"주님, 성전에서 봉헌되신 예수님을 따라 저희 삶도 기꺼이 당신께 봉헌하게 하소서. 아멘."},"02-03":{n:"성 블라시오 주교 순교자 · 성 안스가리오 주교",r:"선택 기념일",c:"홍색/백색",i:"병자와 목의 질환, 선교, 복음 전파",p:"성 블라시오와 성 안스가리오여, 몸과 영혼의 병을 겪는 이들과 복음을 전하는 이들을 위하여 전구해 주소서. 아멘."},"02-05":{n:"성녀 아가타 동정 순교자",r:"기념일",c:"홍색",i:"박해받는 이들, 여성, 신앙의 용기와 정결",p:"성녀 아가타여, 시련 속에서도 그리스도께 충실한 용기를 저희에게 청해 주소서. 아멘."},"02-06":{n:"성 바오로 미키와 동료 순교자들",r:"기념일",c:"홍색",i:"일본과 아시아의 복음화, 박해받는 그리스도인, 순교의 용기",p:"성 바오로 미키와 동료 순교자들이여, 저희가 어떤 어려움에서도 복음을 부끄러워하지 않도록 전구해 주소서. 아멘."},"02-10":{n:"성녀 스콜라스티카 동정",r:"기념일",c:"백색",i:"수도생활, 형제자매, 관상과 기도, 공동체",p:"성녀 스콜라스티카여, 저희가 사랑과 기도 안에서 하느님을 찾고 공동체를 소중히 여기도록 전구해 주소서. 아멘."},"02-11":{n:"루르드의 복되신 동정 마리아",r:"선택 기념일",c:"백색",i:"병자, 치유를 구하는 이들, 순례자, 성모 신심",p:"루르드의 성모 마리아님, 병들고 낙심한 이들을 당신 아드님께 맡겨 주시고 저희가 희망을 잃지 않도록 도와주소서. 아멘."},"02-14":{n:"성 치릴로 수도자와 성 메토디오 주교",r:"기념일",c:"백색",i:"선교사, 언어와 번역, 유럽의 일치, 복음 선포",p:"성 치릴로와 성 메토디오여, 모든 민족이 자신의 언어와 문화 안에서 복음을 만나도록 전구해 주소서. 아멘."},"02-18":{n:"재의 수요일",r:"사순 시기",c:"자색",i:"회개, 금식, 자선, 사순 시기의 새로운 시작",p:"주님, 저희가 마음을 돌이켜 복음을 믿고 기도와 절제와 자선으로 부활을 준비하게 하소서. 아멘."},"02-22":{n:"사순 제1주일",r:"주일",c:"자색"},"02-27":{n:"나렉의 성 그레고리오 아빠스 학자",r:"선택 기념일",c:"백색",i:"기도, 회개, 영적 문학, 동방과 서방 교회의 친교",p:"나렉의 성 그레고리오여, 저희가 깊은 회개와 기도로 하느님의 자비를 찾도록 전구해 주소서. 아멘."},"03-19":{n:"복되신 동정 마리아의 배필 성 요셉",r:"대축일",c:"백색"},"03-25":{n:"주님 탄생 예고 대축일",r:"대축일",c:"백색"},"04-05":{n:"주님 부활 대축일",r:"대축일",c:"백색"},"05-24":{n:"성령 강림 대축일",r:"대축일",c:"홍색"},"06-29":{n:"성 베드로와 성 바오로 사도 대축일",r:"대축일",c:"홍색"},"08-15":{n:"성모 승천 대축일",r:"대축일",c:"백색"},"09-03":{n:"성 그레고리오 대 교황 학자",r:"기념일",c:"백색"},"09-05":{n:"콜카타의 성녀 데레사 동정",r:"선택 기념일",c:"백색",i:"가난한 이들에 대한 사랑, 자선, 선교, 봉사",p:"콜카타의 성녀 데레사여, 가장 가난하고 버림받은 이들 안에서 그리스도를 섬긴 사랑을 본받도록 저희를 위하여 전구해 주소서. 아멘."},"09-08":{n:"복되신 동정 마리아 탄생 축일",r:"축일",c:"백색"},"09-09":{n:"성 베드로 클라베르 사제",r:"기념일",c:"백색"},"09-14":{n:"성 십자가 현양 축일",r:"축일",c:"홍색"},"09-15":{n:"고통의 성모 마리아",r:"기념일",c:"백색"},"09-17":{n:"빙엔의 성녀 힐데가르트 동정 학자",r:"선택 기념일",c:"백색"},"09-21":{n:"성 마태오 사도 복음사가",r:"축일",c:"홍색"},"09-23":{n:"피에트렐치나의 성 비오 사제 (파드레 피오)",r:"기념일",c:"백색",d:"1887–1968. 카푸친 작은형제회 사제로서 기도, 고해성사, 미사와 병자 돌봄에 헌신했습니다. 특히 고통받는 이들을 위한 영적 돌봄으로 널리 알려져 있습니다.",i:"고통 중 인내, 회개와 고해성사, 병자와 가족, 깊은 기도 생활",p:"성 비오 사제여, 고통 속에서도 그리스도를 사랑하고 이웃을 섬긴 당신의 모범을 따라, 저희가 믿음과 인내 안에 머물도록 전구해 주소서. 아멘."},"09-29":{n:"성 미카엘·가브리엘·라파엘 대천사",r:"축일",c:"백색"},"09-30":{n:"성 예로니모 사제 학자",r:"기념일",c:"백색"},"10-01":{n:"아기 예수의 성녀 데레사 동정 학자",r:"기념일",c:"백색"},"10-09":{n:"성 존 헨리 뉴먼 사제 학자",r:"선택 기념일",c:"백색",i:"진리 탐구, 신앙과 이성, 회심, 교육과 학문",p:"성 존 헨리 뉴먼이여, 진리의 빛을 충실히 따라간 당신의 모범을 본받아 저희도 그리스도의 진리 안에서 평화를 찾도록 전구해 주소서. 아멘."},"11-01":{n:"모든 성인 대축일",r:"대축일",c:"백색"},"12-08":{n:"원죄 없이 잉태되신 복되신 동정 마리아 대축일",r:"대축일",c:"백색"},"12-25":{n:"주님 성탄 대축일",r:"대축일",c:"백색"}};let current=new Date().getMonth()+1;const m=document.getElementById('months');for(let i=1;i<=12;i++){let b=document.createElement('button');b.textContent=i+'월';b.onclick=()=>render(i);m.appendChild(b)}function render(mon){current=mon;const days=new Date(2026,mon,0).getDate(),out=[];for(let d=1;d<=days;d++){let k=String(mon).padStart(2,'0')+'-'+String(d).padStart(2,'0'),s=special[k];out.push(`<article class="card"><div class="date">2026년 ${mon}월 ${d}일</div><h2>${s?s.n:'전례일 · 성인 자료 검수 중'}</h2>${s?`<span class="badge">${s.r} · ${s.c}</span>`:''}${s&&(s.d||s.i||s.p)?`<div class="detail">${s.d?`<b>생애</b><p>${s.d}</p>`:''}${s.i?`<b>전구 · 스페셜리티</b><p>${s.i}</p>`:''}${s.p?`<div class="prayer"><b>호칭기도</b><br>${s.p}</div>`:''}</div>`:''}</article>`)}document.getElementById('list').innerHTML=out.join('');scrollTo({top:document.querySelector('.wrap').offsetTop,behavior:'smooth'})}function showToday(){let n=new Date();render(n.getMonth()+1)}render(current)</script></body></html>
