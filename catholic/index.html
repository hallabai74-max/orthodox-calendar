<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6f1d2c"><link rel="apple-touch-icon" href="padre-pio-icon.jpg"><link rel="manifest" href="manifest.webmanifest"><title>가톨릭 365 성인 달력</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f1e4;color:#33251f;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}.hero{height:220px;background:linear-gradient(0deg,rgba(50,16,23,.74),rgba(50,16,23,.08)),url('padre-pio-icon.jpg') center 28%/cover;display:flex;align-items:flex-end;padding:24px;color:white}.hero h1{margin:5px 0;font-size:29px}.wrap{max-width:820px;margin:auto;padding:18px}.era{width:100%;padding:20px 12px;border:2px solid #b68c36;border-radius:20px;background:#fffaf0;color:#702033;font-size:18px;font-weight:900;box-shadow:0 7px 18px #4c2b1715}.months{display:flex;gap:10px;overflow-x:auto;padding:18px 0 12px;scrollbar-width:none}.months button{flex:0 0 62px;padding:13px 5px;border:1px solid #d2b474;border-radius:10px;background:#fffaf0;color:#702033;font-weight:900;font-size:16px;box-shadow:0 4px 0 #dfd3bc}.months button.active{background:#762039;color:#fff}.search{width:100%;padding:13px;border:1px solid #d7bd87;border-radius:13px;background:white;font-size:16px}.monthHero{margin-top:18px;border-radius:18px 18px 0 0;overflow:hidden;background:linear-gradient(135deg,#7b2539,#45131f);color:white;display:grid;grid-template-columns:38% 62%;min-height:160px;box-shadow:0 8px 24px #5c30121a}.monthPhoto{background:url('padre-pio-icon.jpg') center/cover}.monthText{padding:25px}.monthText small{letter-spacing:3px;color:#e9cc89;font-weight:800}.monthText h2{font-size:42px;margin:7px 0}.monthText p{margin:0;color:#f3dfce}.hint{background:#fff;border-left:5px solid #bd913b;padding:14px 17px;line-height:1.65}.dayCard{background:#fff;border:1px solid #e4cea0;border-radius:18px;padding:18px;margin:16px 0;box-shadow:0 7px 18px #5c301214}.dayTop{display:flex;gap:14px;align-items:flex-start}.dayNo{flex:0 0 66px;height:76px;border-radius:13px;background:#7a3040;color:white;font-size:31px;font-weight:900;display:flex;align-items:center;justify-content:center}.dayTitle{flex:1}.dayTitle h3{font-size:21px;margin:4px 0;color:#261d19}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.pill{background:#f4eee3;border-radius:999px;padding:6px 9px;font-size:12px;color:#695447}.pill.gold{background:#fff2cd}.acc{margin-top:12px;border:1.5px solid #b78d3d;border-radius:12px;overflow:hidden}.acc button{width:100%;border:0;background:#fff9eb;color:#702033;text-align:left;padding:14px 16px;font-weight:900;font-size:17px;display:flex;justify-content:space-between}.accBody{display:none;padding:15px 17px;border-top:1px solid #e9d6ae;line-height:1.8;background:#fff}.acc.open .accBody{display:block}.prayerBody{background:#fff8e7}.toolbar{display:flex;gap:9px;margin:14px 0}.toolbar button{border:1px solid #c39c51;background:#fffaf0;color:#702033;border-radius:11px;padding:11px;font-weight:800}.notice{font-size:13px;color:#6d6055;line-height:1.6}@media(max-width:520px){.hero{height:190px}.monthHero{grid-template-columns:36% 64%}.monthText{padding:20px 16px}.monthText h2{font-size:38px}.dayCard{padding:15px}.dayNo{flex-basis:58px;height:68px}}</style></head><body><header class="hero"><div><small>CATHOLIC · 2026</small><h1>가톨릭 365일 성인 축일 달력</h1><div>성인 · 생애 · 영성 · 스페셜리티 · 전구 · 호칭기도</div></div></header><main class="wrap"><button class="era" onclick="location.href='era-prayers.html'">☦ 시대별 · 세기별 성인 호칭기도　⌄</button><div class="months" id="months"></div><input id="search" class="search" placeholder="성인·축일 검색" oninput="render(currentMonth)"><div class="toolbar"><button onclick="showToday()">오늘</button><button onclick="showMonthlyPrayer()">월별 통합 호칭기도</button></div><section id="list"></section></main><script>window.CATHOLIC_2026=window.CATHOLIC_2026||{};</script><script src="data/january-2026.js"></script><script src="data/february-2026.js"></script><script src="data/march-2026.js"></script><script src="data/april-2026.js"></script><script src="data/may-2026.js"></script><script src="data/june-2026.js"></script><script src="data/july-2026.js"></script><script src="data/august-2026.js"></script><script src="data/september-2026.js"></script><script src="data/october-2026.js"></script><script src="data/november-2026.js"></script><script src="data/december-2026.js"></script><script>const mn=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];let currentMonth=1;const e=s=>(s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));function monthButtons(){months.innerHTML=mn.map((x,i)=>`<button class="${currentMonth===i+1?'active':''}" onclick="render(${i+1})">${x}</button>`).join('')}function acc(label,body,cls=''){return `<div class="acc ${cls}"><button onclick="this.parentElement.classList.toggle('open')"><span>${label}</span><span>⌄</span></button><div class="accBody">${body}</div></div>`}function dayCard(m,d,x){const title=e(x.title||x.n||'가톨릭 전례일');const detail=e(x.detail||'이 날의 성인과 전례에 대한 상세 자료를 보강하고 있습니다.');const specialty=e(x.specialty||x.i||'신앙의 성장과 성덕을 위한 전구');const prayer=e(x.prayer||x.p||`${title}이여, 저희가 그리스도를 충실히 따르도록 저희를 위하여 빌어 주소서. 아멘.`);return `<article class="dayCard"><div class="dayTop"><div class="dayNo">${d}</div><div class="dayTitle"><h3>${title}</h3><div class="meta"><span class="pill">${e(x.rank||'전례일')}</span><span class="pill gold">전례색 ${e(x.color||'—')}</span></div></div></div>${acc('상세보기',`<b>생애 · 역사 · 영성</b><br>${detail}<br><br><b>스페셜리티 · 전구 분야</b><br>${specialty}`)}${acc('☦ 호칭기도',prayer,'prayerBody')}${acc(`☦ ${m}월 통합 호칭기도`,`이 달의 성인들을 한 분 한 분 호명하며 바치는 통합 호칭기도는 아래 ‘월별 통합 호칭기도’ 버튼에서도 한꺼번에 볼 수 있습니다.`,'prayerBody')}</article>`}function render(m){currentMonth=m;monthButtons();const data=CATHOLIC_2026[m]||{},q=(search.value||'').trim().toLowerCase();let rows=Object.keys(data).sort((a,b)=>+a-+b).map(d=>[d,data[d]]);if(q)rows=rows.filter(([d,x])=>JSON.stringify(x).toLowerCase().includes(q)||`${m}월 ${d}일`.includes(q));list.innerHTML=`<div class="monthHero"><div class="monthPhoto"></div><div class="monthText"><small>MONTH ${String(m).padStart(2,'0')}</small><h2>${m}월</h2><p>가톨릭 성인과 축일의 기록</p></div></div><div class="hint">이 달의 성인·축일을 날짜별로 볼 수 있습니다. <b>상세보기</b>와 <b>호칭기도</b>를 눌러 내용을 펼쳐 보세요.</div>`+(rows.length?rows.map(([d,x])=>dayCard(m,d,x)).join(''):'<article class="dayCard">이 달의 데이터를 보강하고 있습니다.</article>')}function showToday(){const n=new Date();search.value='';render(n.getMonth()+1)}function showMonthlyPrayer(){const data=CATHOLIC_2026[currentMonth]||{},ps=Object.keys(data).sort((a,b)=>+a-+b).map(d=>{const x=data[d],t=e(x.title||x.n||'성인');return `<div style="padding:8px 0;border-bottom:1px dotted #ddc79b"><b>${currentMonth}월 ${d}일 · ${t}</b><br>${e(x.prayer||x.p||`${t}이여, 저희를 위하여 빌어 주소서.`)}</div>`}).join('');list.innerHTML=`<div class="monthHero"><div class="monthPhoto"></div><div class="monthText"><small>MONTH ${String(currentMonth).padStart(2,'0')}</small><h2>${currentMonth}월</h2><p>통합 호칭기도</p></div></div><article class="dayCard"><button onclick="render(currentMonth)" style="border:0;background:none;color:#702033;font-weight:900">← 달력으로</button><div style="line-height:1.8;margin-top:12px">${ps}</div></article>`}monthButtons();render(1);if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></body></html>
