<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6f1d2c"><link rel="apple-touch-icon" href="padre-pio-icon.jpg"><link rel="manifest" href="manifest.webmanifest"><title>가톨릭 365 성인 달력</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:#f7f1e6;color:#2d211b}.hero{min-height:42vh;background:linear-gradient(0deg,rgba(40,15,18,.76),rgba(40,15,18,.12)),url('padre-pio-icon.jpg') center 28%/cover;display:flex;align-items:flex-end;padding:30px 20px;color:#fff}.hero h1{margin:6px 0;font-size:32px}.wrap{max-width:920px;margin:auto;padding:18px}.eraTop{width:100%;border:1px solid #b88a35;background:linear-gradient(135deg,#fffaf0,#f3dfb3);border-radius:16px;padding:17px 12px;margin:16px 0;color:#6f1d2c;font-weight:900;font-size:17px;box-shadow:0 6px 18px #5c301217}.eraTop small{display:block;margin-top:5px;color:#775e4d;font-size:13px}.months{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.months button,.toolbar button{border:1px solid #c7a45c;background:#fffaf0;border-radius:12px;padding:12px 7px;font-weight:800;color:#6f1d2c}.months button.active{background:#6f1d2c;color:#fff}.toolbar{display:flex;gap:8px;overflow:auto;margin:16px 0}.toolbar button{white-space:nowrap}.card{background:#fff;border:1px solid #ead8b1;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 8px 24px #5c30121a}.featuredCard{border:2px solid #c49a45;background:linear-gradient(180deg,#fff,#fff8e8)}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#6f1d2c;color:#fff;font-size:12px;font-weight:800}.date{font-size:13px;color:#8a6b56}.card h2{margin:8px 0;color:#6f1d2c;font-size:21px}.detail{border-top:1px solid #eee0c4;margin-top:14px;padding-top:14px;line-height:1.75}.prayer{background:#fff7e6;border-left:4px solid #c49a45;padding:14px;border-radius:10px;line-height:1.75}.notice{font-size:13px;color:#6f6258;line-height:1.6}.search{width:100%;padding:13px 15px;border:1px solid #d7bd87;border-radius:14px;font-size:16px;background:#fff}.sectionTitle{color:#6f1d2c;margin:20px 0 8px}.close{float:right;border:0;background:none;font-size:20px}@media(max-width:520px){.months{grid-template-columns:repeat(4,1fr)}.hero{min-height:38vh}.hero h1{font-size:27px}}</style></head><body><header class="hero"><div><span class="badge">CATHOLIC · 2026</span><h1>가톨릭 365일 성인 달력</h1><p>성인 · 축일 · 전례색 · 전구 · 호칭기도</p></div></header><main class="wrap"><button class="eraTop" onclick="showEraPrayer()">시대별 통합 호칭기도<small>사도·초대교회 · 교부 · 수도자 · 근현대 성인</small></button><input id="search" class="search" placeholder="성인·축일 검색" oninput="render(currentMonth)"><div class="months" id="months"></div><div class="toolbar"><button onclick="showToday()">오늘</button><button onclick="showMonthlyPrayer()">월별 통합 호칭기도</button></div><p class="notice">2026년 일반 로마 전례력 중심으로 구성했습니다. 지역 고유 전례력은 추가 거행이 있을 수 있습니다.</p><section id="list"></section></main><script>window.CATHOLIC_2026=window.CATHOLIC_2026||{};</script><script src="data/january-2026.js"></script><script src="data/february-2026.js"></script><script src="data/march-2026.js"></script><script src="data/april-2026.js"></script><script src="data/may-2026.js"></script><script src="data/june-2026.js"></script><script src="data/july-2026.js"></script><script src="data/august-2026.js"></script><script src="data/september-2026.js"></script><script src="data/october-2026.js"></script><script src="data/november-2026.js"></script><script src="data/december-2026.js"></script><script>const names=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];let currentMonth=new Date().getMonth()+1;const esc=s=>(s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));function buttons(){months.innerHTML=names.map((n,i)=>`<button class="${i+1===currentMonth?'active':''}" onclick="render(${i+1})">${n}</button>`).join('')}function card(m,d,x,featured=false){return `<article class="card ${featured?'featuredCard':''}"><div class="date">2026년 ${m}월 ${d}일 · ${esc(x.color||'')}</div><span class="badge">${featured?'★ 주요 성인 · ':''}${esc(x.rank||'전례일')}</span><h2>${esc(x.title||x.n||'')}</h2>${x.detail?`<div class="detail"><b>생애 · 영성 · 상세보기</b><br>${esc(x.detail)}</div>`:''}${x.specialty||x.i?`<div class="detail"><b>전구 · 스페셜리티</b><br>${esc(x.specialty||x.i)}</div>`:''}${x.prayer||x.p?`<div class="prayer"><b>호칭 · 전구기도</b><br>${esc(x.prayer||x.p)}</div>`:''}</article>`}function render(m){currentMonth=m;buttons();const q=(search.value||'').trim().toLowerCase();const data=CATHOLIC_2026[m]||{};let rows=Object.keys(data).sort((a,b)=>+a-+b).map(d=>[d,data[d]]);if(q)rows=rows.filter(([d,x])=>JSON.stringify(x).toLowerCase().includes(q)||`${m}월 ${d}일`.includes(q));list.innerHTML=`<h2 class="sectionTitle">${m}월</h2>`+(rows.length?rows.map(([d,x])=>card(m,d,x,(m===9&&+d===23)||(m===10&&+d===5))).join(''):'<div class="card">검색 결과가 없습니다.</div>')}function showToday(){const n=new Date();currentMonth=n.getMonth()+1;search.value='';render(currentMonth)}function showMonthlyPrayer(){const data=CATHOLIC_2026[currentMonth]||{};const prayers=Object.values(data).filter(x=>x.prayer||x.p).map(x=>`<div class="prayer"><b>${esc(x.title||x.n||'')}</b><br>${esc(x.prayer||x.p)}</div>`).join('');list.innerHTML=`<button class="close" onclick="render(currentMonth)">×</button><h2 class="sectionTitle">${currentMonth}월 통합 호칭기도</h2>${prayers||'<div class="card">이 달의 개별 호칭기도를 계속 보강하고 있습니다.</div>'}`}function showEraPrayer(){list.innerHTML=`<button class="close" onclick="render(currentMonth)">×</button><h2 class="sectionTitle">시대별 통합 호칭기도</h2><div class="card"><h2>사도와 초대교회</h2><div class="prayer">거룩한 사도들과 초대교회의 순교자들이여, 저희가 복음을 담대히 증언하고 시련 속에서도 그리스도께 충실하도록 전구해 주소서. 아멘.</div></div><div class="card"><h2>교부와 교회 학자</h2><div class="prayer">거룩한 교부들과 교회 학자들이여, 저희가 진리를 사랑하고 믿음과 이성을 조화롭게 사용하여 교회의 가르침 안에서 성장하도록 전구해 주소서. 아멘.</div></div><div class="card"><h2>수도자와 중세 성인</h2><div class="prayer">거룩한 수도자들과 관상가들이여, 저희가 기도와 절제, 사랑의 봉사 안에서 하느님을 첫자리에 모시도록 전구해 주소서. 아멘.</div></div><div class="card"><h2>근현대 성인</h2><div class="prayer">근현대의 거룩한 성인들이여, 변화하는 세상 속에서도 복음의 빛을 잃지 않고 가난한 이들과 고통받는 이들을 사랑하도록 전구해 주소서. 아멘.</div></div>`;list.scrollIntoView({behavior:'smooth'})}buttons();render(currentMonth);if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></body></html>
