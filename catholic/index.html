<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6f1d2c"><link rel="apple-touch-icon" href="padre-pio-icon.jpg"><link rel="manifest" href="manifest.webmanifest"><title>가톨릭 365 성인 달력</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f1e4;color:#33251f;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}.hero{height:210px;background:linear-gradient(0deg,rgba(50,16,23,.74),rgba(50,16,23,.08)),url('padre-pio-icon.jpg') center 28%/cover;display:flex;align-items:flex-end;padding:24px;color:white}.hero h1{margin:5px 0;font-size:29px}.wrap{max-width:820px;margin:auto;padding:18px}.era{width:100%;padding:20px 12px;border:2px solid #b68c36;border-radius:20px;background:#fffaf0;color:#702033;font-size:18px;font-weight:900}.months{display:flex;gap:10px;overflow-x:auto;padding:18px 0 12px}.months button{flex:0 0 62px;padding:13px 5px;border:1px solid #d2b474;border-radius:10px;background:#fffaf0;color:#702033;font-weight:900;font-size:16px}.months button.active{background:#762039;color:#fff}.search{width:100%;padding:13px;border:1px solid #d7bd87;border-radius:13px;background:white;font-size:16px}.monthHero{margin-top:18px;border-radius:18px 18px 0 0;overflow:hidden;background:linear-gradient(135deg,#7b2539,#45131f);color:white;display:grid;grid-template-columns:38% 62%;min-height:160px}.monthPhoto{background:url('padre-pio-icon.jpg') center/cover}.monthText{padding:25px}.monthText small{letter-spacing:3px;color:#e9cc89;font-weight:800}.monthText h2{font-size:42px;margin:7px 0}.hint{background:#fff;border-left:5px solid #bd913b;padding:14px 17px;line-height:1.65}.dayCard{background:#fff;border:1px solid #e4cea0;border-radius:18px;padding:18px;margin:16px 0}.dayTop{display:flex;gap:13px;align-items:flex-start}.dayNo{flex:0 0 64px;height:76px;border-radius:13px;background:#7a3040;color:white;font-size:31px;font-weight:900;display:flex;align-items:center;justify-content:center}.saintImg{width:82px;height:105px;border-radius:10px;object-fit:cover;border:2px solid #d2b474}.dayTitle{flex:1}.dayTitle h3{font-size:21px;margin:5px 0}.who{font-size:13px;color:#725f50}.meta{display:flex;gap:7px;flex-wrap:wrap}.pill{background:#f4eee3;border-radius:999px;padding:6px 9px;font-size:12px}.pill.gold{background:#fff2cd}.acc{margin-top:12px;border:1.5px solid #b78d3d;border-radius:12px;overflow:hidden}.acc button{width:100%;border:0;background:#fff9eb;color:#702033;text-align:left;padding:14px 16px;font-weight:900;font-size:17px;display:flex;justify-content:space-between}.accBody{display:none;padding:15px 17px;border-top:1px solid #e9d6ae;line-height:1.85;background:#fff}.acc.open .accBody{display:block}.litany{font-size:17px}.litanyLine{padding:8px 0;border-bottom:1px dotted #dfc998}.litanyLine b{color:#702033}.toolbar{display:flex;gap:9px;margin:14px 0}.toolbar button{border:1px solid #c39c51;background:#fffaf0;color:#702033;border-radius:11px;padding:11px;font-weight:800}@media(max-width:520px){.hero{height:185px}.monthHero{grid-template-columns:36% 64%}.monthText{padding:20px 16px}.dayCard{padding:14px}.dayNo{flex-basis:54px;height:66px}.saintImg{width:70px;height:92px}}</style></head><body><header class="hero"><div><small>CATHOLIC · 2026</small><h1>가톨릭 365일 성인 축일 달력</h1><div>성인 · 성화 · 생애 · 스페셜리티 · 전구 · 호칭기도</div></div></header><main class="wrap"><button class="era" onclick="location.href='era-prayers.html'">☦ 시대별 · 세기별 성인 호칭기도　⌄</button><div class="months" id="months"></div><input id="search" class="search" placeholder="성인·축일 검색" oninput="render(currentMonth)"><div class="toolbar"><button onclick="showToday()">오늘</button><button onclick="showMonthlyPrayer()">☦ 월별 통합 호칭기도</button></div><section id="list"></section></main><script>window.CATHOLIC_2026=window.CATHOLIC_2026||{};</script><script src="data/january-2026.js"></script><script src="data/february-2026.js"></script><script src="data/march-2026.js"></script><script src="data/april-2026.js"></script><script src="data/may-2026.js"></script><script src="data/june-2026.js"></script><script src="data/july-2026.js"></script><script src="data/august-2026.js"></script><script src="data/september-2026.js"></script><script src="data/october-2026.js"></script><script src="data/november-2026.js"></script><script src="data/december-2026.js"></script><script>const mn=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];let currentMonth=1;const e=s=>(s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));function monthButtons(){months.innerHTML=mn.map((x,i)=>`<button class="${currentMonth===i+1?'active':''}" onclick="render(${i+1})">${x}</button>`).join('')}function acc(label,body){return `<div class="acc"><button onclick="this.parentElement.classList.toggle('open')"><span>${label}</span><span>⌄</span></button><div class="accBody">${body}</div></div>`}function invocation(t){return `${t}이여, 저희를 위하여 빌어 주소서.`}function litanyNames(x){if(Array.isArray(x.litanyNames))return x.litanyNames;if(x.litanyNames)return String(x.litanyNames).split('|');let t=x.title||x.n||'';if(t.includes('성 대 바실리오와 성 나지안조의 그레고리오'))return ['성 대 바실리오','성 나지안조의 그레고리오'];if(t.includes('성 티모테오와 성 티토'))return ['성 티모테오','성 티토'];if(t.includes('성녀 안젤라 메리치'))return ['성녀 안젤라 메리치'];if(t.includes('성 토마스 아퀴나스'))return ['성 토마스 아퀴나스'];if(t.includes('성 요한 보스코'))return ['성 요한 보스코'];if(t.includes('성 프란치스코 살레시오'))return ['성 프란치스코 살레시오'];if(t.includes('성녀 아녜스'))return ['성녀 아녜스'];if(t.includes('성 안토니오 아빠스'))return ['성 안토니오 아빠스'];if(t.includes('성 힐라리오'))return ['성 힐라리오'];if(t.includes('성 라이문도'))return ['페냐포르트의 성 라이문도'];if(t.includes('성 요한 노이만'))return ['성 요한 노이만'];if(t.includes('성녀 엘리사벳 앤 시튼'))return ['성녀 엘리사벳 앤 시튼'];if(t.includes('천주의 성모 마리아'))return ['천주의 성모 마리아'];if(t.includes('세례자'))return ['세례자 성 요한'];return []}function monthlyLitany(m){const data=CATHOLIC_2026[m]||{};let names=[];Object.keys(data).sort((a,b)=>+a-+b).forEach(d=>{litanyNames(data[d]).forEach(n=>{if(n&&!names.includes(n))names.push(n)})});if(!names.length)return '<div>이 달의 성인 호칭기도 명단을 보강하고 있습니다.</div>';return `<div class="litany"><p><b>${m}월의 거룩한 성인들이여, 저희와 함께 하느님께 전구해 주소서.</b></p>${names.map(n=>`<div class="litanyLine"><b>${e(n)}이여,</b> 저희를 위하여 빌어 주소서.</div>`).join('')}<p><b>${m}월에 기념하는 모든 성인과 복자들이여,</b> 저희를 위하여 빌어 주소서.<br>우리 주 그리스도를 통하여 비나이다. 아멘.</p></div>`}function dayCard(m,d,x){const t=e(x.title||x.n||'가톨릭 전례일'),detail=e(x.detail||''),special=e(x.specialty||x.i||''),pr=e(x.prayer||x.p||invocation(t)),img=e(x.image||x.img||'padre-pio-icon.jpg');return `<article class="dayCard"><div class="dayTop"><div class="dayNo">${d}</div><img class="saintImg" src="${img}" alt="${t}" onerror="this.src='padre-pio-icon.jpg'"><div class="dayTitle"><div class="who">${m}월 ${d}일 축일</div><h3>${t}</h3><div class="meta"><span class="pill">${e(x.rank||'전례일')}</span><span class="pill gold">전례색 ${e(x.color||'—')}</span></div></div></div>${acc('상세보기',`<b>생애 · 역사 · 주요 일화 · 영성</b><br>${detail}<br><br><b>스페셜리티 · 전구 분야</b><br>${special}`)}${acc('☦ 호칭기도',pr)}${acc(`☦ ${m}월 통합 호칭기도`,monthlyLitany(m))}</article>`}function render(m){currentMonth=m;monthButtons();const data=CATHOLIC_2026[m]||{},q=(search.value||'').trim().toLowerCase();let rows=Object.keys(data).sort((a,b)=>+a-+b).map(d=>[d,data[d]]);if(q)rows=rows.filter(([d,x])=>JSON.stringify(x).toLowerCase().includes(q));list.innerHTML=`<div class="monthHero"><div class="monthPhoto"></div><div class="monthText"><small>MONTH ${String(m).padStart(2,'0')}</small><h2>${m}월</h2><p>가톨릭 성인과 축일의 기록</p></div></div><div class="hint">날짜마다 성화 · 축일 · 상세보기 · 호칭기도 · 월별 통합 호칭기도를 볼 수 있습니다.</div>`+(rows.length?rows.map(([d,x])=>dayCard(m,d,x)).join(''):'<article class="dayCard">이 달의 데이터를 보강하고 있습니다.</article>')}function showToday(){const n=new Date();search.value='';render(n.getMonth()+1)}function showMonthlyPrayer(){list.innerHTML=`<div class="monthHero"><div class="monthPhoto"></div><div class="monthText"><small>MONTH ${String(currentMonth).padStart(2,'0')}</small><h2>${currentMonth}월</h2><p>통합 호칭기도</p></div></div><article class="dayCard"><button onclick="render(currentMonth)" style="border:0;background:none;color:#702033;font-weight:900">← 달력으로</button>${monthlyLitany(currentMonth)}</article>`}monthButtons();render(1);if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></body></html>
