<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6f1d2c"><title>시대별 통합 호칭기도</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f1e6;color:#2d211b;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}.wrap{max-width:820px;margin:auto;padding:18px}.top{position:sticky;top:0;background:#f7f1e6ee;backdrop-filter:blur(10px);padding:12px 0;z-index:2}.back{border:1px solid #c49a45;background:#fffaf0;color:#6f1d2c;border-radius:12px;padding:10px 14px;font-weight:800}h1,h2{color:#6f1d2c}.intro,.group{background:#fff;border:1px solid #ead8b1;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 8px 24px #5c30121a}.litany{background:#fff7e6;border-left:4px solid #c49a45;padding:14px 16px;border-radius:10px;line-height:1.9;font-size:17px}.litany div{padding:3px 0;border-bottom:1px dotted #ead8b1}.litany div:last-child{border:0}.response{font-weight:800;color:#6f1d2c}.note{font-size:13px;color:#6f6258;line-height:1.6}</style></head><body><main class="wrap"><div class="top"><button class="back" onclick="location.href='index.html'">← 달력으로 돌아가기</button></div><h1>시대별 · 세기별 통합 호칭기도</h1><div class="intro">한 시대를 한 문장으로 묶지 않고, 성인과 성경의 거룩한 인물들을 <b>한 분 한 분 이름으로 호명</b>하며 바치는 형식입니다. 각 호명 뒤에 <span class="response">“저희를 위하여 빌어 주소서.”</span>라고 응답합니다.</div><div id="groups"></div><p class="note">※ 성경 인물의 호칭과 성인 명칭은 가톨릭 전통에서 널리 쓰이는 한국어 표기를 중심으로 구성했습니다. 한 성인이 여러 세기에 걸쳐 생존한 경우 대표적으로 활동한 시대에 배치했습니다.</p></main><script>const R='저희를 위하여 빌어 주소서.';const groups=[['구약의 의인과 예언자들',['성 아벨','성 노아','성 아브라함','성녀 사라','성 이사악','성녀 리브가','성 야곱','성녀 라헬','성 요셉','성 모세','성 아론','성 여호수아','성 사무엘','성 다윗 왕','성 엘리야','성 엘리사','성 이사야','성 예레미야','성 에제키엘','성 다니엘','성 욥','성 토빗','성녀 유딧','성녀 에스테르','성 즈카르야','성녀 엘리사벳']],['신약 · 주님의 시대와 사도들',['천주의 성모 마리아','성 요셉','성 요한 세례자','성 베드로 사도','성 바오로 사도','성 안드레아 사도','성 야고보 대사도','성 요한 사도','성 토마스 사도','성 필립보 사도','성 바르톨로메오 사도','성 마태오 사도','성 시몬 사도','성 유다 타대오 사도','성 야고보 소사도','성 마티아 사도','성녀 마리아 막달레나','성녀 마르타','성 라자로','성 스테파노 첫 순교자','성 바르나바 사도','성 마르코 복음사가','성 루카 복음사가','성 티모테오','성 티토']],['1세기 · 사도교회와 첫 증인들',['성 클레멘스 1세 교황','성 이냐시오 데 안티오키아','성 폴리카르포','성 리노 교황','성 아나클레토 교황','성 에바리스토 교황']],['2세기 · 교부와 순교자들',['성 유스티노 순교자','성 이레네오','성녀 펠리치타','성녀 페르페투아','성녀 체칠리아','성녀 아가타','성녀 루치아']],['3세기 · 박해와 신앙의 증인들',['성 치프리아노','성 라우렌시오','성 세바스티아노','성 코스마','성 다미아노','성녀 아녜스','성 판크라시오']],['4세기 · 사막교부와 대교부들',['성 안토니오 아빠스','성 파코미오','성 마카리오','성 아타나시오','성 바실리오 대교부','나지안조의 성 그레고리오','니사의 성 그레고리오','성 암브로시오','성 예로니모','성 마르티노 데 투르','성녀 모니카']],['5세기 · 교부시대의 성숙',['성 아우구스티노','성 요한 크리소스토모','성 치릴로 데 알렉산드리아','성 대 레오 교황','성 파트리치오','성녀 제노베파']],['6세기',['성 베네딕토','성녀 스콜라스티카','성 대 그레고리오 교황','성 콜룸바노','성 이시도로']],['7세기',['성 막시모 고백자','성 아우구스티노 데 캔터베리','성 엘리지오','성녀 힐다']],['8세기',['성 베다 존자','성 보니파시오','성 요한 다마스체노','성녀 발부르가']],['9세기',['성 치릴로','성 메토디오','성 안스가리오']],['10세기',['성 아달베르토','성 울리히','성 둔스타노']],['11세기',['성 안셀모','성 브루노','성녀 마르가리타 데 스코틀랜드','성 베드로 다미아노']],['12세기',['성 베르나르도','성 노르베르토','성녀 힐데가르트 폰 빙엔','성 토마스 베켓']],['13세기',['아시시의 성 프란치스코','성녀 클라라','성 도미니코','파도바의 성 안토니오','성 토마스 아퀴나스','성 보나벤투라','헝가리의 성녀 엘리사벳']],['14세기',['시에나의 성녀 가타리나','스웨덴의 성녀 비르지타','성 로코']],['15세기',['성녀 잔 다르크','성 빈첸시오 페레르','시에나의 성 베르나르디노']],['16세기 · 종교개혁과 가톨릭 쇄신',['로욜라의 성 이냐시오','아빌라의 성녀 데레사','십자가의 성 요한','성 필립보 네리','성 프란치스코 하비에르','성 토마스 모어','성 요한 피셔','성 가롤로 보로메오']],['17세기',['성 빈첸시오 아 바오로','성녀 루이즈 드 마리약','성 프란치스코 살레시오','성녀 잔 프랑수아 드 샹탈','성 로베르토 벨라르미노']],['18세기',['성 알폰소 마리아 데 리구오리','십자가의 성 바오로','성 루도비코 마리아 그리뇽 드 몽포르']],['19세기',['아르스의 성 요한 마리아 비안네','성 요한 보스코','성녀 마리아 도메니카 마자렐로','성녀 베르나데트 수비루','성 다미아노 데 몰로카이','성녀 데레사 베르제리']],['20세기 · 현대의 증인들',['아기 예수의 성녀 데레사','성 비오 10세 교황','성 막시밀리아노 마리아 콜베','성녀 에디트 슈타인','성 요한 23세 교황','성 바오로 6세 교황','성 요한 바오로 2세 교황','성녀 데레사 데 콜카타','성 오스카 로메로','성녀 파우스티나 코발스카','피에트렐치나의 성 비오(파드레 피오)','성 호세마리아 에스크리바','성 카를로 아쿠티스']],['한국의 성인과 순교자들',['성 김대건 안드레아','성 정하상 바오로','성녀 김효주 아녜스','성녀 김효임 골룸바','성 남명혁 다미아노','성녀 권희 바르바라','성 이광헌 아우구스티노','성녀 박희순 루치아','성녀 유소사 체칠리아','성녀 김성임 마르타','성 최경환 프란치스코','성녀 이연희 마리아','성녀 김제준 이냐시오','성녀 김임이 데레사']]];groups.forEach(([title,names])=>{const s=document.createElement('section');s.className='group';s.innerHTML='<h2>'+title+'</h2><div class="litany">'+names.map(n=>'<div><b>'+n+'</b>이여, <span class="response">'+R+'</span></div>').join('')+'</div>';document.getElementById('groups').appendChild(s)});</script></body></html>
